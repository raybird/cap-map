<div class="timeline-wrapper">
  <div class="year-indicator" *ngIf="currentCenterYear !== 0">
    {{ currentCenterYear < 0 ? '公元前' + (-currentCenterYear) : currentCenterYear + ' 年' }}
  </div>

  <div class="center-needle"></div>

  <div class="timeline-container" #scrollContainer
    [class.dragging]="isDragging"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onDragEnd()"
    (mouseleave)="onDragEnd()"
    (scroll)="onScroll()">
    <div class="timeline-track" [style.width.px]="trackWidth">

      <!-- Dynasty bands -->
      <div class="dynasty-bands">
        <div class="dynasty-band"
          *ngFor="let period of (periods$ | async)"
          [style.left.px]="getPixelPosition(period.startYear)"
          [style.width.px]="getPixelWidth(period.startYear, period.endYear)"
          [style.background-color]="period.color"
          (click)="onPeriodClick(period)">
          <span class="dynasty-label">
            {{ period.label }}
            <span class="dynasty-years">{{ period.startYear }} ~ {{ period.endYear }}</span>
          </span>
        </div>
      </div>

      <!-- Event dots -->
      <div class="event-dots" *ngIf="events$ | async as events">
        <div class="event-dot"
          *ngFor="let event of events"
          [style.left.px]="getPixelPosition(getEventYear(event))"
          [style.top.%]="getEventStaggerTop(event, events)"
          [style.background-color]="getEventColor(event)"
          [title]="event.title"
          (click)="onEventClick(event)">
        </div>
      </div>

      <!-- Year ticks -->
      <div class="year-ticks">
        <div class="year-tick"
          *ngFor="let tick of yearTicks"
          [style.left.px]="getPixelPosition(tick.year)"
          [class.major-tick]="tick.major">
          <span class="year-label" *ngIf="tick.major">{{ tick.label }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
